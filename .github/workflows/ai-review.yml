name: "02 · Admissão | Parecer contextual"
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: admission-ai-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Apenas a conta administradora pode disparar a análise paga.
    if: >-
      github.event.label.name == 'admission:run-ai' &&
      github.event.sender.id == 349365411 &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: "Obter código confiável"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Análise contextual do snapshot público"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 scripts/admission.py ai
