name: "01 · Admissão | Validar inscrição"
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Número do Issue a reanalisar"
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: admission-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: "Obter código de validação da Peekyard"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Analisar solicitação sem executar código de terceiros"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: python3 scripts/admission.py intake
