name: "Admissão · testes do módulo"
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout sem credenciais persistentes"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "Validar sintaxe Python"
        run: python3 -m py_compile scripts/admission.py
      - name: "Executar testes do módulo"
        run: python3 -m unittest discover -s tests -v
